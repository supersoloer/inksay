[package]
name = "inksay-tauri"
version = "0.1.0"
description = "InkSay desktop voice input"
authors = ["唐小羲"]
license = "GPL-3.0-only"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "inksay_tauri_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
cpal = "0.17"
hound = "3.5"
flacenc = { version = "=0.5.1", default-features = false }
rubato = "5"
tauri-plugin-shell = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "multipart"] }
tokio = { version = "1", features = ["fs", "io-util", "sync", "time"] }
sha2 = "0.10"
regex = "1"
tauri-plugin-dialog = "2"
zhconv = { version = "=0.4.2", default-features = false, features = ["compress", "opencc-hans"] }
jieba-rs = "=0.10.4"
keyring = { version = "=3.6.3", default-features = false, features = ["apple-native", "windows-native"] }
tauri-plugin-single-instance = "=2.4.5"

[target.'cfg(target_os = "macos")'.dependencies]
tauri-nspanel = "=2.1.0"
core-graphics = "0.25"
core-foundation = "0.10"
accessibility-sys = "0.2"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSPasteboard", "NSPasteboardItem", "NSRunningApplication", "NSWorkspace", "NSWindow", "NSScreen", "NSColor", "NSSound"] }
objc2-foundation = { version = "0.3", features = ["NSArray", "NSData", "NSString"] }
objc2-web-kit = { version = "0.3", features = ["WKWebView"] }
objc2-av-foundation = { version = "0.3", features = ["AVCaptureDevice", "AVMediaFormat", "block2"] }
block2 = "0.6"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_System_Diagnostics_Debug", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole", "Win32_UI_Accessibility", "Win32_Graphics_Gdi", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints"] }

[dependencies.tauri-plugin-clipboard-manager]
version = "2"

[dependencies.base64]
version = "0.22"

[dependencies.tauri-plugin-autostart]
version = "2"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
# Keep local development builds compact; release settings remain independent.
[profile.dev]
debug = 0
incremental = false

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[features]
prompt-eval = []

[dev-dependencies]
claxon = "=0.4.3"
