name: 问题反馈
description: 提交可复现的问题，不附带密钥或个人录音。
title: "[Bug] "
body:
  - type: input
    id: version
    attributes:
      label: 版本和 Build
      description: 可以在“关于”页面查看。
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: 系统版本与架构
      placeholder: 例如 macOS / Apple Silicon 或 Windows 11 / x64
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤、预期和实际结果
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: 模型与接口协议（如适用）
      description: 不要填写 API Key，私有服务地址请脱敏。
  - type: textarea
    id: evidence
    attributes:
      label: 脱敏后的错误信息或截图
      description: 不要上传个人历史 JSON、原始录音或包含凭据的日志。
